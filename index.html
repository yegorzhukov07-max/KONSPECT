<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Живой конспект</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #18222d; color: #fff; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        video { width: 100%; max-width: 420px; border-radius: 14px; background: #000; aspect-ratio: 4/3; object-fit: cover; }
        button { width: 100%; max-width: 420px; margin-top: 20px; padding: 16px; font-size: 16px; font-weight: 600; border: none; border-radius: 12px; background: #2ea6ff; color: #fff; }
        button.recording { background: #ff3b30; }
        .status { margin-top: 14px; font-size: 14px; text-align: center; line-height: 1.4; word-break: break-word; }
    </style>
</head>
<body>
    <video id="preview" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="toggleBtn" type="button">🔴 Начать запись конспекта</button>
    <div class="status" id="statusText">Готов к работе. Нажми кнопку.</div>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('statusText').innerText = "Ошибка JS (строка " + line + "): " + msg;
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbxIiv4xpoXORC_qJ3ELOL_PJ1m0u0TOgWlhJ06f1YPy2XQBL90nbxcundZ5yO_2_FkX/exec";
        let userId = 0;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                userId = window.Telegram.WebApp.initDataUnsafe?.user?.id || 0;
            }
        } catch (e) {}

        let stream = null, mediaRecorder = null, isRecording = false, intervalId = null, chunksCount = 0;
        const video = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const btn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');

        btn.onclick = async function() {
            statusText.innerText = "Клик сработал! Включаю камеру...";
            if (!isRecording) {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        statusText.innerText = "Этот браузер блокирует камеру. Нажми ⋮ сверху -> Открыть в браузере.";
                        return;
                    }
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: true });
                    video.srcObject = stream;
                    statusText.innerText = "Камера есть! Создаю Google Документ...";

                    const res = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'start_session', user_id: userId })
                    });
                    const data = await res.json();
                    if (data.status !== "ok") throw new Error(JSON.stringify(data));

                    isRecording = true;
                    chunksCount = 0;
                    btn.innerText = "⏹ Остановить запись";
                    btn.classList.add('recording');
                    statusText.innerText = "Запись идет! Каждые 30 сек обновляю конспект.";

                    recordNextChunk();
                    intervalId = setInterval(() => {
                        if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
                    }, 30000);
                } catch (err) {
                    statusText.innerText = "Сбой запуска: " + err.name + " - " + err.message;
                }
            } else {
                isRecording = false;
                clearInterval(intervalId);
                if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
                if (stream) stream.getTracks().forEach(t => t.stop());
                video.srcObject = null;
                btn.innerText = "🔴 Начать запись конспекта";
                btn.classList.remove('recording');
                statusText.innerText = "Запись остановлена.";
            }
        };

        function recordNextChunk() {
            if (!isRecording || !stream) return;
            mediaRecorder = new MediaRecorder(new MediaStream(stream.getAudioTracks()));
            let chunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const audioB64 = reader.result.split(',')[1];
                    let imgB64 = null;
                    if (video.videoWidth) {
                        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                        imgB64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                    }
                    if (isRecording) recordNextChunk();
                    chunksCount++;
                    const num = chunksCount;
                    statusText.innerText = "Отправляю фрагмент #" + num + "...";
                    try {
                        await fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'chunk', user_id: userId, audio: audioB64, mime: blob.type, image: imgB64 })
                        });
                        if (isRecording) statusText.innerText = "Фрагмент #" + num + " добавлен!";
                    } catch (e) {
                        statusText.innerText = "Ошибка сети на #" + num + ": " + e.message;
                    }
                };
                reader.readAsDataURL(blob);
            };
            mediaRecorder.start();
        }
    </script>
</body>
</html>
