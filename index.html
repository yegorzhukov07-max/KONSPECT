<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Живой конспект</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            background: #000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            aspect-ratio: 4/3;
            object-fit: cover;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }
        button {
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        button.recording {
            background-color: #ff3b30;
        }
        .status {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
            opacity: 0.9;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <video id="preview" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="controls">
        <button id="toggleBtn" onclick="toggleRecording()">🔴 Начать запись конспекта</button>
    </div>
    <div class="status" id="statusText">Нажми кнопку, чтобы разрешить доступ к камере и микрофону</div>

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 0;

        let isRecording = false;
        let intervalId = null;
        let wakeLock = null;

        const statusText = document.getElementById('statusText');

            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (e) {}

            if (!isRecording) await startRecording();
            else stopRecording();

                method: 'POST',

                body: JSON.stringify(payloadObj)
            });
            return await response.json();
        }
